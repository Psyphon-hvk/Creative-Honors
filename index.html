<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Honors | Vote for the Future</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
--text-light:#ffffff;
--gold:#d4af37;
--glass:rgba(255,255,255,0.08);
--blur:blur(12px);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body,html{
height:100%;
font-family:'Plus Jakarta Sans',sans-serif;
color:var(--text-light);
background:#050505;
}

/* HERO */

.hero{
position:relative;
width:100%;
height:100vh;

background:
radial-gradient(circle at 20% 30%, rgba(212,175,55,0.15), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(212,175,55,0.08), transparent 40%),
linear-gradient(135deg,#050505,#0d0d0d,#111);

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

/* NAVBAR */

nav{
position:absolute;
top:0;
width:100%;
padding:25px 5%;
display:flex;
justify-content:space-between;
align-items:center;
z-index:10;
}

.logo{
font-size:1.1rem;
font-weight:600;
letter-spacing:-0.5px;
text-transform:uppercase;
color:var(--gold);
}

.nav-links{
display:flex;
gap:25px;
}

.nav-links a{
text-decoration:none;
color:white;
font-size:13px;
font-weight:500;
opacity:0.8;
}

.nav-links a:hover{
opacity:1;
}

/* HAMBURGER */

.menu-toggle{
display:none;
font-size:26px;
cursor:pointer;
}

/* HERO CONTENT */

.hero-content{
padding:0 20px;
z-index:2;
}

.hero-content h2{
font-size:12px;
text-transform:uppercase;
letter-spacing:4px;
margin-bottom:20px;
font-weight:400;
color:var(--gold);
}

.hero-content h1{
font-family:'Playfair Display',serif;
font-size:clamp(2.8rem,10vw,6.5rem);
line-height:0.95;
font-weight:400;
}

.hero-content h1 span{
display:block;
font-style:italic;
}



.vote-btn{
margin-top:40px;
padding:16px 36px;
background:var(--glass);
backdrop-filter:var(--blur);
border:1px solid rgba(255,255,255,0.15);
border-radius:50px;
text-decoration:none;
color:white;
font-size:14px;
display:inline-flex;
gap:12px;
transition:.4s;
}

.vote-btn:hover{
background:rgba(212,175,55,0.15);
border-color:var(--gold);
transform:translateY(-3px);
}

/* FOOTER */

.bottom-bar{
position:absolute;
bottom:30px;
width:100%;
padding:0 5%;
display:flex;
justify-content:space-between;
align-items:center;
font-size:11px;
letter-spacing:1px;
opacity:0.7;
}

.pill{
padding:8px 18px;
border:1px solid rgba(255,255,255,0.15);
border-radius:20px;
text-decoration:none;
color:var(--gold);
}

/* MOBILE */

@media(max-width:768px){

.menu-toggle{
display:block;
}

.nav-links{
position:absolute;
top:80px;
right:5%;
background:#0b0b0b;
border:1px solid rgba(255,255,255,0.1);
border-radius:10px;
flex-direction:column;
padding:20px;
gap:15px;
display:none;
}

.nav-links.active{
display:flex;
}

.hero-content h1{
font-size:3rem;
line-height:1.1;
}

.bottom-bar{
flex-direction:column;
gap:15px;
text-align:center;
bottom:20px;
}

}

/* GRAIN EFFECT */

.grain{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("https://grainy-gradients.vercel.app/noise.svg");
opacity:0.05;
pointer-events:none;
}

</style>
</head>

<body>

<div class="grain"></div>

<nav>

<div class="logo">Creative Honors</div>

<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<div class="nav-links" id="navLinks">
<a href="new.html">Nominees</a>

</div>

</nav>

<main class="hero">

<div class="hero-content">

<h2>The People's Choice Awards</h2>

<h1>
<span>Honoring the</span>
new creators
</h1>

<a href="new.html" class="vote-btn">
Cast your vote ↘
</a>

</div>

</main>

<footer class="bottom-bar">

<a href="#" class="pill">2026 Voting is now open</a>

<div>CREATIVE HONORS ©2026</div>

</footer>

<script>

function toggleMenu(){
document.getElementById("navLinks").classList.toggle("active");
}

</script>

</body>
</html>
